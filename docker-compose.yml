version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=Smart OCR Scanner API
      - DATABASE_URL=sqlite:////app/data/ocr_scanner.db
      - SECRET_KEY=${SECRET_KEY:-super-secret-ocr-jwt-key-oracle-cloud-2026}
      - BLUR_THRESHOLD_DEFAULT=380.0
      - WEBP_MAX_DIMENSION=2400
      - WEBP_QUALITY=82
      - LLM_PROVIDER=${LLM_PROVIDER:-AUTO}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
    volumes:
      # Persistencia de imágenes WebP en el disco del VPS
      - ./uploads_data:/app/uploads
      # Persistencia de la base de datos SQLite
      - ./db_data:/app/data
    ports:
      # Exposición interna/directa si se requiere depuración
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: ocr-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Define tu dominio aquí o en tu archivo .env (ej. DOMAIN=mi-ocr.duckdns.org o DOMAIN=:80)
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
